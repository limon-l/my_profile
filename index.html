                        'meteor': 'meteor 4s linear infinite',
                        'orbit': 'orbit 14s linear infinite',
                        'shimmer': 'shimmer 2.5s linear infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-12px)' },

                        'pulse-soft': {
                            '0%, 100%': { opacity: '0.4' },

                        'glow-text': {
                            '0%, 100%': { textShadow: '0 0 8px rgba(56,189,248,0.3)' },

                            '0%': { backgroundPosition: '0% 50%' },
                            '50%': { backgroundPosition: '100% 50%' },
                            '100%': { backgroundPosition: '0% 50%' },
                        },

                            to: { opacity: '1', transform: 'translateY(0)' },

                            to: { opacity: '1', transform: 'translateY(0)' },

                        'slide-left': {

                            to: { opacity: '1', transform: 'translateX(0)' },
                        },
                        'slide-right': {
                            from: { opacity: '0', transform: 'translateX(60px)' },
                            to: { opacity: '1', transform: 'translateX(0)' },
                        },
                        'scale-in': {
                            from: { opacity: '0', transform: 'scale(0.92)' },
                            to: { opacity: '1', transform: 'scale(1)' },
                        },
                        'fade-in': {
                            from: { opacity: '0' },
                            to: { opacity: '1' },
                        },
                        'blur-in': {
                            from: { opacity: '0', filter: 'blur(12px)', transform: 'translateY(20px)' },
                            to: { opacity: '1', filter: 'blur(0px)', transform: 'translateY(0)' },
                        },
                        typewriter: {
                            from: { width: '0' },
                            to: { width: '100%' },
                        },
                        blink: {
                            '50%': { borderColor: 'transparent' },
                        },
                        aurora: {
                            '0%': { transform: 'translate3d(-10%, -10%, 0) rotate(0deg) scale(1)' },
                            '33%': { transform: 'translate3d(8%, 5%, 0) rotate(10deg) scale(1.1)' },
                            '66%': { transform: 'translate3d(-5%, 8%, 0) rotate(-5deg) scale(0.95)' },
                            '100%': { transform: 'translate3d(-10%, -10%, 0) rotate(0deg) scale(1)' },
                        },
                        'particle-drift': {
                            '0%': { transform: 'translate(0, 0) scale(0.8)', opacity: '0.2' },
                            '50%': { transform: 'translate(15px, -35px) scale(1)', opacity: '0.7' },
                            '100%': { transform: 'translate(-10px, 15px) scale(0.9)', opacity: '0.25' },
                        },
                        meteor: {
                            '0%': { transform: 'translate(0, 0) scaleX(0.3)', opacity: '0' },
                            '8%': { opacity: '1' },
                            '100%': { transform: 'translate(500px, 300px) scaleX(1)', opacity: '0' },

                            from: { transform: 'rotate(0deg)' },
                            to: { transform: 'rotate(360deg)' },
                        },
                        shimmer: {
                            from: { transform: 'translateX(-100%)' },
                            to: { transform: 'translateX(100%)' },

                        'gradient-conic': 'conic-gradient(from 180deg, var(--tw-gradient-stops))',
